<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medialogi 2. sem — HCI & informationssøgning (AAUB)</title>

<!-- ===== Lokale basestile (kan overstyres af aub.style.css) ===== -->
<style>
  :root{
    --clr-bg:#FFFFFF;
    --clr-ink:#211a52;              /* Primær */
    --clr-ink-weak:#42406b;
    --clr-accent:#594fbf;           /* Accent */
    --clr-sec1:#df8e2e;             /* Sekundær */
    --clr-sec2:#007fa3;             /* Sekundær */
    --clr-surface:#f5f6ff;
    --clr-surface-2:#eef2ff;
    --clr-border:#d6d8f0;
    --radius:16px;
    --radius-lg:20px;
    --pad:20px;
    --shadow:0 6px 24px rgba(33,26,82,.12);
    --focus: 0 0 0 3px #fff, 0 0 0 6px var(--clr-sec2);
    --font:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    --font-bold:700;
    --font-xbold:800;
  }
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--clr-ink);
    background:var(--clr-bg);
    -webkit-font-smoothing:antialiased;
  }
  /* Lille fallback-stil så siden ikke virker tom uden ekstern CSS */
  .container{
    max-width: 980px;
    margin: 0 auto;
    padding: 24px;
  }
  .card{
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }
  h1{margin: 0 0 8px 0;}
  h2{margin: 24px 0 8px 0;}
  ul{margin: 0; padding-left: 20px;}
  .muted{color: var(--clr-ink-weak); font-size: .95rem;}
</style>

<!-- ===== Ekstern AUB stylesheet (samme mappe) =====
     Brug en simpel relativ sti. Hvis HTML og CSS ligger i samme mappe:
     href="aub.style.css"  (case-sensitive på GitHub Pages) -->
<link rel="stylesheet" href="aub.style.css" />
</head>

<body>
<noscript>Aktivér JavaScript for at se indholdet.</noscript>

<main id="app" class="container">
  <header class="card">
    <h1>Medialogi 2. sem — HCI & informationssøgning (AAUB)</h1>
    <p class="muted">Denne side bruger <code>aub.style.css</code> til udseende og layout.</p>
  </header>

  <section id="goals" class="card" aria-labelledby="goals-title">
    <h2 id="goals-title">Læringsmål</h2>
    <ul id="goals-list"></ul>
  </section>

  <section id="agenda" class="card" aria-labelledby="agenda-title">
    <h2 id="agenda-title">Agenda</h2>
    <ul id="agenda-list"></ul>
  </section>

  <section id="quiz" class="card" aria-labelledby="quiz-title">
    <h2 id="quiz-title">Quiz</h2>
    <div id="quiz-list"></div>
  </section>
</main>

<script>
/* ======================= CONFIG (indhold/tekster) ======================= */
const CONFIG = {
  modules: ["quiz","dragdrop","querybuilder","sus"],
  pointsEnabled: true,
  printEnabled: true,
  texts: {
    goals: [
      "Anvende HCI- og interaktionsdesign-principper til at planlægge og evaluere en mobil app i PBL-kontekst",
      "Udforme reproducerbare søgestrategier (AND/OR/NOT, trunkering) i Scopus/ACM/IEEE og dokumentere dem",
      "Udføre en letvægts-UX-evaluering (heuristikker + SUS) og oversætte fund til designforbedringer"
    ],
    agenda: [
      "00:00–00:05 – Intro, læringsmål og format",
      "00:05–00:15 – HCI i Medialogi: MMI, interaktionsdesign, mobilapp",
      "00:15–00:25 – Databaser & værktøjer (Scopus, ACM DL, IEEE Xplore, PRIMO, Zotero/Mendeley)",
      "00:25–00:40 – Interaktiv quiz: kildekritik og relevans",
      "00:40–00:45 – Spørgsmål & opsamling (blok 1)",
      "00:45–01:00 – Pause (15 min)",
      "01:00–01:10 – Drag & drop: HCI-begreber",
      "01:10–01:20 – Søgestreng-bygger (fra behov til forespørgsel)",
      "01:20–01:30 – Snowballing (trinvis miniøvelse)",
      "01:30–01:40 – SUS mini-survey på demo-flow",
      "01:40–01:45 – Case & næste skridt (blok 2)"
    ],
    quiz: [
      {
        q: "Hvad indikerer en ‘controlled vocabulary’ (fx IEEE Thesaurus) i en database?",
        options: [
          "At alle artikler er peer-reviewed",
          "At søgeord normaliseres til standardtermer",
          "At databasen kun dækker 2020-nuværende",
          "At søgning altid er booleansk"
        ],
        correct: 1,
        explain: "Kontrollerede termer (emneord) sikrer konsistent indeksering og bedre tilbagefindelighed."
      },
      {
        q: "Hvilken kombination giver DEN bredeste søgning?",
        options: [
          "mobile AND onboarding",
          "mobile OR smartphone",
          "\"mobile onboarding\"",
          "mobile NOT game"
        ],
        correct: 1,
        explain: "OR udvider mængden ved at inkludere synonymer/relaterede termer."
      }
    ]
  }
};

/* ============ Minimal rendering så siden ikke er tom ============ */
function renderList(items, ul) {
  ul.innerHTML = "";
  items.forEach(text => {
    const li = document.createElement("li");
    li.textContent = text;
    ul.appendChild(li);
  });
}

function renderQuiz(quiz, container) {
  container.innerHTML = "";
  quiz.forEach((item, idx) => {
    const wrapper = document.createElement("div");
    wrapper.style.marginBottom = "14px";
    const q = document.createElement("p");
    q.innerHTML = `<strong>Q${idx+1}.</strong> ${item.q}`;
    wrapper.appendChild(q);

    item.options.forEach((opt, i) => {
      const id = `q${idx}_opt${i}`;
      const label = document.createElement("label");
      label.setAttribute("for", id);
      label.style.display = "block";
      label.style.cursor = "pointer";

      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${idx}`;
      input.id = id;
      input.value = i;

      label.appendChild(input);
      label.appendChild(document.createTextNode(" " + opt));
      wrapper.appendChild(label);
    });

    const feedback = document.createElement("div");
    feedback.className = "muted";
    feedback.style.marginTop = "6px";
    wrapper.appendChild(feedback);

    wrapper.addEventListener("change", (e) => {
      const val = Number(e.target.value);
      if (val === item.correct) {
        feedback.textContent = "✔ Korrekt! " + item.explain;
      } else {
        feedback.textContent = "✖ Ikke helt. " + item.explain;
      }
    });

    container.appendChild(wrapper);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  try {
    renderList(CONFIG.texts.goals, document.getElementById("goals-list"));
    renderList(CONFIG.texts.agenda, document.getElementById("agenda-list"));
    renderQuiz(CONFIG.texts.quiz, document.getElementById("quiz-list"));
  } catch (err) {
    console.error("Render-fejl:", err);
    const app = document.getElementById("app");
    if (app) {
      app.innerHTML = "<p>Der opstod en fejl under indlæsning af indholdet.</p>";
    }
  }
});
</script>
</body>
</html>
